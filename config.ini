# 抓取配置（UTF-8）
# 访问 GitHub raw 的本地代理。复制到没有代理的机器时，把这一行留空即可。
# 程序始终先直连 GitHub，只有直连失败才会使用这里配置的代理。
proxy=127.0.0.1:7897
# 1=允许为 GitHub 使用代理；0=永远直连
github_proxy=1
# 每次运行自动补抓最近多少天（含今天）里缺失的文件；已存在的直接跳过
catchup_days=7
# 每次请求之间的间隔，毫秒。不要调得太小，避免给站点造成压力
delay_ms=1000
# 输出目录，相对程序所在目录
output_dir=output
# 新闻联播来源：auto / github / govopen / cctv
# auto = GitHub -> cn.govopendata.com -> 央视网，逐级回退
xwlb_source=auto
